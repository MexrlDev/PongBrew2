
name: Download Font Data

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  download-font:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download font_data.h
        run: |
          set -euo pipefail

          mkdir -p src

          curl -fL \
            "https://github.com/MexrlDev/PongBrew2/releases/download/source-part/font_data.h" \
            -o src/font_data.h

          test -s src/font_data.h

          echo "Successfully downloaded font_data.h"
          ls -lh src/font_data.h
