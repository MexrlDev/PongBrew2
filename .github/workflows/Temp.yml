
name: Download Font Data

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  download-font:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download font_data.h from latest release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p src

          RELEASE_JSON=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/MexrlDev/PongBrew2/releases/latest)

          ASSET_ID=$(echo "$RELEASE_JSON" | jq -er \
            '.assets[] | select(.name == "font_data.h") | .id' | head -n 1)

          if [ -z "$ASSET_ID" ]; then
            echo "font_data.h was not found in the latest release"
            exit 1
          fi

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/MexrlDev/PongBrew2/releases/assets/$ASSET_ID" \
            -o src/font_data.h

          test -s src/font_data.h
          echo "Downloaded src/font_data.h successfully"
