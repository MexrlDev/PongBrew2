
name: Download Font Data

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  download-font:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download font_data.h
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p src

          curl -fL \
            "https://github.com/MexrlDev/PongBrew2/releases/download/source-part/font_data.h" \
            -o src/font_data.h

          test -s src/font_data.h

          echo "Successfully downloaded src/font_data.h"
          ls -lh src/font_data.h

      - name: Commit and push font_data.h
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f src/font_data.h

          if git diff --cached --quiet; then
            echo "font_data.h is already up to date."
            exit 0
          fi

          git commit -m "Update src/font_data.h from release"
          git push origin HEAD:main
