
name: Fix Font Commit Author

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-author:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Back up main and rewrite the bot commit
        shell: bash
        env:
          GIT_AUTHOR_EMAIL: 82407748+MexrlDev@users.noreply.github.com
        run: |
          set -euo pipefail

          git config user.name "MexrlDev"
          git config user.email "$GIT_AUTHOR_EMAIL"

          git fetch origin main

          # Find exactly the intended bot commit.
          mapfile -t MATCHES < <(
            git log origin/main \
              --format='%H%x09%an%x09%s' |
            awk -F '\t' \
              '$2 == "github-actions[bot]" &&
               $3 == "Update src/font_data.h from release" {
                print $1
              }'
          )

          if [ "${#MATCHES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one matching bot commit; found ${#MATCHES[@]}."
            exit 1
          fi

          OLD_COMMIT="${MATCHES[0]}"
          echo "Target commit: $OLD_COMMIT"

          # Preserve the original history on GitHub.
          BACKUP="backup-before-author-fix-${GITHUB_RUN_ID}"

          git branch "$BACKUP" origin/main
          git push origin \
            "refs/heads/$BACKUP:refs/heads/$BACKUP"

          # Work on a local main branch.
          git switch -C main origin/main

          # Rewrite authorship without changing file contents.
          export TARGET_COMMIT="$OLD_COMMIT"

          git filter-branch --force \
            --env-filter '
              if [ "$GIT_COMMIT" = "$TARGET_COMMIT" ]; then
                export GIT_AUTHOR_NAME="MexrlDev"
                export GIT_AUTHOR_EMAIL="82407748+MexrlDev@users.noreply.github.com"
                export GIT_COMMITTER_NAME="MexrlDev"
                export GIT_COMMITTER_EMAIL="82407748+MexrlDev@users.noreply.github.com"
              fi
            ' main

          # Confirm the target commit no longer has the bot as author.
          NEW_COMMIT=$(git log main \
            --format='%H%x09%an%x09%s' |
            awk -F '\t' \
              '$2 == "MexrlDev" &&
               $3 == "Update src/font_data.h from release" {
                print $1
                exit
              }')

          if [ -z "$NEW_COMMIT" ]; then
            echo "::error::Could not verify the rewritten commit."
            exit 1
          fi

          echo "Rewritten commit: $NEW_COMMIT"

          # Push only if main has not changed since checkout.
          git push \
            --force-with-lease="refs/heads/main:$(git rev-parse origin/main)" \
            origin main:main

          echo "Successfully updated main."
          echo "Backup branch: $BACKUP"
