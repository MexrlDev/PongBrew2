
name: Download Font Data

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  download-font:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download font_data.h
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p src

          API_URL="https://api.github.com/repos/MexrlDev/PongBrew2/releases/latest"

          RELEASE_JSON=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "$API_URL") || {
              echo "::error::Could not fetch the latest release. Check that the repository is public and has a published release."
              exit 1
            }

          ASSET_URL=$(echo "$RELEASE_JSON" | jq -er \
            '.assets[] | select(.name == "font_data.h") | .browser_download_url' \
            | head -n 1) || {
              echo "::error::font_data.h is not attached to the latest release."
              echo "Check the release assets at https://github.com/MexrlDev/PongBrew2/releases"
              exit 1
            }

          curl -fL "$ASSET_URL" -o src/font_data.h

          test -s src/font_data.h

          echo "Successfully downloaded src/font_data.h"

      - name: Verify file
        run: ls -lh src/font_data.h
