
name: Fix Font Commit Author

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-author:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite bot commit
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git checkout -B main origin/main

          OLD=$(git log origin/main \
            --format='%H %an %s' |
            grep 'github-actions\[bot\] Update src/font_data.h from release' |
            head -n 1 |
            cut -d ' ' -f 1)

          if [ -z "$OLD" ]; then
            echo "::error::Bot commit not found."
            exit 1
          fi

          BACKUP="backup-author-fix-${GITHUB_RUN_ID}"
          git branch "$BACKUP" main
          git push origin "$BACKUP"

          export TARGET_COMMIT="$OLD"

          git filter-branch --force \
            --env-filter '
              if [ "$GIT_COMMIT" = "$TARGET_COMMIT" ]; then
                export GIT_AUTHOR_NAME="MexrlDev"
                export GIT_AUTHOR_EMAIL="82407748+MexrlDev@users.noreply.github.com"
                export GIT_COMMITTER_NAME="MexrlDev"
                export GIT_COMMITTER_EMAIL="82407748+MexrlDev@users.noreply.github.com"
              fi
            ' main

          git log -1 --format='%H %an %s' main

          git push \
            --force-with-lease="refs/heads/main:$(git rev-parse origin/main)" \
            origin main:main
